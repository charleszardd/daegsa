schema_version: 1
name: donation-api-capacity

request:
  url: http://127.0.0.1:8080/api/donations
  method: GET
  headers:
    Accept: application/json
    Authorization: Bearer test-token-xyz
  expected_statuses: [200]
  timeout: 5s
  response_body_limit: 1MiB
  redirects: same-origin

load:
  model: open
  rate: 100
  time_unit: 1s
  max_in_flight: 500
  duration: 30s
  graceful_stop: 10s

rate_limit:
  treat_429_as_expected: false

thresholds:
  http_error_rate: "<= 1%"
  p95: "<= 500ms"
  p99: "<= 1s"
  completed_rps: ">= 90"
  dropped_requests: "== 0"

safety:
  allowed_hosts:
    - 127.0.0.1
    - localhost
  allow_non_idempotent: false
