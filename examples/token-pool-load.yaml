schema_version: 1
name: token-pool-load-test

request:
  url: ${TARGET_URL}/auth/token-pool
  method: GET
  headers:
    Accept: application/json
  expected_statuses: [200]
  timeout: 5s
  response_body_limit: 1MiB
  redirects: same-origin

auth:
  type: token_pool
  token_pool:
    - ${TOKEN_1}
    - ${TOKEN_2}
    - ${TOKEN_3}

load:
  model: open
  rate: 50
  time_unit: 1s
  max_in_flight: 100
  duration: 10s
  graceful_stop: 2s

rate_limit:
  treat_429_as_expected: false

thresholds:
  http_error_rate: "== 0%"
  p95: "<= 100ms"
  completed_rps: ">= 45"

safety:
  allowed_hosts:
    - 127.0.0.1
    - localhost
  allow_non_idempotent: false
